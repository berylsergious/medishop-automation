name: MediShop Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker Compose
        run: docker compose version

      - name: Start Selenium Grid
        run: docker compose up -d

      - name: Wait for Selenium Grid
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:4444/status; then
              echo "Selenium Grid is responding."
              exit 0
            fi
            sleep 2
          done
          echo "Selenium Grid did not become ready."
          docker compose ps
          docker compose logs
          exit 1

      - name: Run smoke tests
        env:
            MEDISHOP_USERNAME: ${{ secrets.MEDISHOP_USERNAME }}
            MEDISHOP_PASSWORD: ${{ secrets.MEDISHOP_PASSWORD }}
        run: mvn clean test "-Dcucumber.filter.tags=@smoke"
        
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: medishop-test-reports
          path: |
            target/cucumber-reports/
            target/surefire-reports/
          if-no-files-found: warn

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down