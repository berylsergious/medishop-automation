name: MediShop Smoke Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  ALLURE_IMAGE: andgineer/allure:2.36.0

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verify Docker Compose
        run: docker compose version

      - name: Start Selenium Grid
        run: docker compose up -d

      - name: Wait for Selenium Grid
        shell: bash
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost:4444/status; then
              echo "Selenium Grid is responding."
              exit 0
            fi
            sleep 2
          done
          echo "Selenium Grid did not become ready."
          docker compose ps
          docker compose logs
          exit 1

      - name: Run smoke tests
        env:
          MEDISHOP_USERNAME: ${{ secrets.MEDISHOP_USERNAME }}
          MEDISHOP_PASSWORD: ${{ secrets.MEDISHOP_PASSWORD }}
        run: mvn clean test "-Dcucumber.filter.tags=@smoke"


      - name: Generate Allure HTML report
        if: always()
        shell: bash
        run: |
          if [ ! -d target/allure-results ] ||
             ! find target/allure-results -type f -name '*-result.json' -print -quit | grep -q .; then
            echo "No Allure test results found. Skipping HTML report generation."
            exit 0
          fi

          # Add GitHub Actions build metadata to the Allure report.
          cat > target/allure-results/executor.json <<EOF
          {
            "name": "GitHub Actions",
            "type": "github",
            "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}",
            "buildOrder": ${GITHUB_RUN_NUMBER},
            "buildName": "${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}",
            "buildUrl": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          }
          EOF

          mkdir -p target/allure-report

          docker run --rm \
            -v "$GITHUB_WORKSPACE/target/allure-results:/app/allure-results:ro" \
            -v "$GITHUB_WORKSPACE/target/allure-report:/app/allure-report" \
            "$ALLURE_IMAGE" \
            allure generate /app/allure-results --clean -o /app/allure-report

          test -s target/allure-report/index.html


      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: medishop-test-reports
          path: |
            target/cucumber-reports/
            target/surefire-reports/
            target/allure-results/
            target/allure-report/
          if-no-files-found: warn

      - name: Stop Selenium Grid
        if: always()
        run: docker compose down